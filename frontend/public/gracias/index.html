<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solicitud recibida | AIT Seguros</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #13202f;
        --muted: #5f6f82;
        --blue: #0b66c3;
        --teal: #0f8b8d;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          linear-gradient(110deg, rgba(16, 42, 67, 0.08), rgba(15, 139, 141, 0.1)),
          #fff;
      }

      main {
        width: min(560px, 100%);
      }

      p:first-child {
        margin: 0 0 10px;
        color: var(--teal);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2.4rem, 8vw, 4.6rem);
        line-height: 0.96;
        letter-spacing: 0;
      }

      p {
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 12px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        border-radius: 8px;
        padding: 0 18px;
        background: var(--blue);
        color: #fff;
        font-weight: 800;
        text-decoration: none;
      }

      a.secondary {
        background: transparent;
        color: var(--blue);
        border: 1px solid rgba(11, 102, 195, 0.3);
      }
    </style>
  </head>
  <body>
    <main>
      <p>Solicitud recibida</p>
      <h1>Gracias</h1>
      <p>Recibimos tus datos. Te contactaremos pronto para revisar tu solicitud.</p>
      <p>¿Quieres atención más rápida? Escríbeme por WhatsApp.</p>
      <div class="actions">
        <a href="https://wa.me/529616158126">Escribir por WhatsApp</a>
        <a class="secondary" href="/">Volver al inicio</a>
      </div>
    </main>
  </body>
</html>
